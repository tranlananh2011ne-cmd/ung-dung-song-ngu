<!DOCTYPE DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Từ Điển Song Ngữ Việt - Nùng</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; }
        h2 { color: #2c3e50; }
        input, select { width: 80%; padding: 10px; margin: 10px 0; font-size: 16px; }
        button { padding: 10px 20px; background-color: #3498db; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #2980b9; }
        #result { margin-top: 20px; padding: 15px; font-weight: bold; font-size: 18px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Từ Điển Song Ngữ Việt - Nùng</h2>
    
    <!-- Chọn chiều dịch -->
    <select id="translateDirection">
        <option value="vi-nung">Tiếng Việt → Tiếng Nùng</option>
        <option value="nung-vi">Tiếng Nùng → Tiếng Việt</option>
    </select>

    <!-- Ô nhập từ -->
    <input type="text" id="wordInput" placeholder="Nhập từ cần dịch...">
    <br>
    <button onclick="translateWord()">Dịch ngay</button>

    <!-- Nơi hiển thị kết quả -->
    <div id="result"></div>
</div>

<script>
    // 1. Kho dữ liệu từ điển (Bạn có thể thêm từ mới vào đây theo đúng cấu trúc)
    const dictionary = {
        "vi-nung": {
            "chào": "bấu",
            "ăn cơm": "kin khẩu",
            "uống nước": "kin nặm",
            "đi đâu": "Pay tơi",
            "cảm ơn": "khọp tơi"
        },
        "nung-vi": {
            "bấu": "chào / không",
            "kin khẩu": "ăn cơm",
            "kin nặm": "uống nước",
            "pay tơi": "đi đâu",
            "khọp tơi": "cảm ơn"
        }
    };

    // 2. Hàm xử lý dịch
    function translateWord() {
        const direction = document.getElementById("translateDirection").value;
        const inputWord = document.getElementById("wordInput").value.trim().toLowerCase();
        const resultDiv = document.getElementById("result");

        if (inputWord === "") {
            resultDiv.innerHTML = "Vui lòng nhập từ cần dịch!";
            resultDiv.className = "error";
            return;
        }

        // Tìm kiếm trong kho dữ liệu
        const translated = dictionary[direction][inputWord];

        if (translated) {
            resultDiv.innerHTML = `Kết quả: ${translated}`;
            resultDiv.className = "success";
        } else {
            resultDiv.innerHTML = "Xin lỗi, từ này chưa có trong từ điển!";
            resultDiv.className = "error";
            }
        }
</script>

</body>
</html>
